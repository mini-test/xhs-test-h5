ext":"下意识说不用，等对方走后才觉得有点失落","score":"ARMOR"}]},{"id":4,"module":"求助与脆弱","dimension":"求助与脆弱","text":"你第一次独立处理一件很复杂的事，中途发现可能做错了。你会？","options":[{"key":"A","text":"一边继续一边旁敲侧击，看看别人会不会提醒","score":"SWING"},{"key":"B","text":"暂停核对，找有经验的人确认关键风险","score":"SECURE"},{"key":"C","text":"先做完再说，被发现也比现在求助强","score":"ARMOR"},{"key":"D","text":"马上问很多人，直到有人明确告诉你选哪个","score":"ANCHOR"}]},{"id":5,"module":"决策与责任","dimension":"决策与责任","text":"你收到一份不错的工作机会，但家人强烈反对。你最可能？","options":[{"key":"A","text":"听完理由，再按自己的标准决定并承担结果","score":"SECURE"},{"key":"B","text":"不再讨论，直接做决定，免得被干扰","score":"ARMOR"},{"key":"C","text":"很难行动，直到重要的人表示支持","score":"ANCHOR"},{"key":"D","text":"先拖一阵，看家人的态度会不会变化","score":"SWING"}]},{"id":6,"module":"决策与责任","dimension":"决策与责任","text":"买一件价格不低、但你很想要且负担得起的东西前，你会？","options":[{"key":"A","text":"谁都不说，买了也不想解释为什么","score":"ARMOR"},{"key":"B","text":"把链接发给几个人，得到认可才更敢下单","score":"ANCHOR"},{"key":"C","text":"放进购物车很多天，在想要和怕后悔间摇摆","score":"SWING"},{"key":"D","text":"核对预算和使用价值，决定后不反复内耗","score":"SECURE"}]},{"id":7,"module":"决策与责任","dimension":"决策与责任","text":"朋友都说你现在的选择“太冒险了”。你更在意？","options":[{"key":"A","text":"开始怀疑自己，希望有人替你保证不会失败","score":"ANCHOR"},{"key":"B","text":"嘴上说已经决定，回去却反复重做比较","score":"SWING"},{"key":"C","text":"他们指出了什么事实，再判断是否值得调整","score":"SECURE"},{"key":"D","text":"更想证明自己不需要任何人的意见","score":"ARMOR"}]},{"id":8,"module":"决策与责任","dimension":"决策与责任","text":"一个决定结果不好，但当时确实是你自己选的。你会？","options":[{"key":"A","text":"一会怪自己，一会觉得是环境逼的","score":"SWING"},{"key":"B","text":"复盘依据和代价，承担后果后修正下一步","score":"SECURE"},{"key":"C","text":"表面无所谓，不让任何人看见后悔","score":"ARMOR"},{"key":"D","text":"很想确认“如果听别人的会不会更好”","score":"ANCHOR"}]},{"id":9,"module":"亲密与依赖","dimension":"亲密与依赖","text":"喜欢的人回复突然变慢，但没有解释。你第一反应更像？","options":[{"key":"A","text":"先照常生活，合适时直接确认对方近况和关系感受","score":"SECURE"},{"key":"B","text":"立刻收回热情，让自己表现得比对方更不在乎","score":"ARMOR"},{"key":"C","text":"反复看聊天记录，想从回复里确认自己是否被喜欢","score":"ANCHOR"},{"key":"D","text":"想问又怕显得黏，改成发别的话题试探","score":"SWING"}]},{"id":10,"module":"亲密与依赖","dimension":"亲密与依赖","text":"伴侣说“这件事你自己决定，我都支持”。你会？","options":[{"key":"A","text":"反而更愿意全部自己处理，不想留下被干预的入口","score":"ARMOR"},{"key":"B","text":"有点慌，希望对方明确说更倾向哪一个","score":"ANCHOR"},{"key":"C","text":"嘴上说好，实际会观察对方表情再选","score":"SWING"},{"key":"D","text":"觉得被尊重，做好决定后和对方同步","score":"SECURE"}]},{"id":11,"module":"亲密与依赖","dimension":"亲密与依赖","text":"关系里发生矛盾，对方说想先冷静一晚。你更可能？","options":[{"key":"A","text":"很难等到明天，想马上得到不会离开的保证","score":"ANCHOR"},{"key":"B","text":"答应冷静，却忍不住发几条试探消息","score":"SWING"},{"key":"C","text":"约好明天沟通的时间，各自冷静后再谈","score":"SECURE"},{"key":"D","text":"直接关掉情绪，做好关系结束的准备","score":"ARMOR"}]},{"id":12,"module":"亲密与依赖","dimension":"亲密与依赖","text":"有人对你说“你可以依靠我”。你心里最接近？","options":[{"key":"A","text":"心里暖一下，又担心靠得太近后失去主动","score":"SWING"},{"key":"B","text":"感动，但会通过长期行动判断这句话是否可靠","score":"SECURE"},{"key":"C","text":"先怀疑这是不是以后控制你的筹码","score":"ARMOR"},{"key":"D","text":"会很想相信，并立刻把很多需要交给对方","score":"ANCHOR"}]},{"id":13,"module":"独处与社交","dimension":"独处与社交","text":"周末计划临时取消，整天突然空下来。你会？","options":[{"key":"A","text":"重新安排想做的事，也保留联系朋友的选择","score":"SECURE"},{"key":"B","text":"松一口气，谁都不想见，也不愿解释","score":"ARMOR"},{"key":"C","text":"一下觉得很空，立刻找人陪才安心","score":"ANCHOR"},{"key":"D","text":"先享受几个小时，到了晚上又很想有人联系","score":"SWING"}]},{"id":14,"module":"独处与社交","dimension":"独处与社交","text":"一个人在餐厅吃饭时，你通常更像？","options":[{"key":"A","text":"尽快吃完，不想让人看出自己是一个人","score":"ARMOR"},{"key":"B","text":"会一直找人聊天，减少独自坐着的不适","score":"ANCHOR"},{"key":"C","text":"表面自在，但会不时观察别人是否注意自己","score":"SWING"},{"key":"D","text":"自在吃饭，需要时也能自然和人交流","score":"SECURE"}]},{"id":15,"module":"独处与社交","dimension":"独处与社交","text":"搬到一个没有熟人的新城市，最先一个月你会？","options":[{"key":"A","text":"频繁联系旧关系，很难在没有陪伴时行动","score":"ANCHOR"},{"key":"B","text":"白天独立探索，晚上容易突然想回到熟悉的人身边","score":"SWING"},{"key":"C","text":"建立生活秩序，同时主动发展少量新连接","score":"SECURE"},{"key":"D","text":"什么都自己搞定，不轻易让新认识的人靠近","score":"ARMOR"}]},{"id":16,"module":"独处与社交","dimension":"独处与社交","text":"连续几天没人主动联系你，你更可能怎么理解？","options":[{"key":"A","text":"白天觉得没什么，夜里又会反复想原因","score":"SWING"},{"key":"B","text":"不直接等同于不被在乎，需要时会主动联系","score":"SECURE"},{"key":"C","text":"正好，说明谁都靠不住，自己过最省事","score":"ARMOR"},{"key":"D","text":"开始怀疑是不是自己不重要或被忘了","score":"ANCHOR"}]},{"id":17,"module":"冲突与边界","dimension":"冲突与边界","text":"朋友临时请你帮忙，但会打乱你已经排好的休息。你会？","options":[{"key":"A","text":"判断紧急程度，能帮多少就明确说多少","score":"SECURE"},{"key":"B","text":"直接拒绝，不让任何人形成依赖你的习惯","score":"ARMOR"},{"key":"C","text":"怕对方失望，先答应再自己压缩休息","score":"ANCHOR"},{"key":"D","text":"嘴上答应一部分，心里又希望对方主动看出为难","score":"SWING"}]},{"id":18,"module":"冲突与边界","dimension":"冲突与边界","text":"家人替你安排了一件“为你好”的事，你其实不想要。你会？","options":[{"key":"A","text":"冷处理或直接不去，不想解释自己的选择","score":"ARMOR"},{"key":"B","text":"担心伤感情，最后很可能照着安排走","score":"ANCHOR"},{"key":"C","text":"先拖着不表态，等事情自然过期","score":"SWING"},{"key":"D","text":"说明感谢和拒绝，给出自己接下来的安排","score":"SECURE"}]},{"id":19,"module":"冲突与边界","dimension":"冲突与边界","text":"关系里你已经不舒服一阵子，但对方似乎没发现。你会？","options":[{"key":"A","text":"不断用情绪和确认，让对方证明还在乎你","score":"ANCHOR"},{"key":"B","text":"偶尔阴阳或变冷，等对方主动来问","score":"SWING"},{"key":"C","text":"找合适时机说清事实、感受和希望改变的部分","score":"SECURE"},{"key":"D","text":"继续忍，直到某天彻底心冷后直接离开","score":"ARMOR"}]},{"id":20,"module":"冲突与边界","dimension":"冲突与边界","text":"对方不同意你的决定，还说你太自私。你更可能？","options":[{"key":"A","text":"当下坚持，之后却反复担心关系会不会变差","score":"SWING"},{"key":"B","text":"确认是否真的伤害边界，但不会仅因指责放弃选择","score":"SECURE"},{"key":"C","text":"马上竖起防御，拒绝再讨论任何细节","score":"ARMOR"},{"key":"D","text":"很容易内疚，开始考虑按对方希望的做","score":"ANCHOR"}]},{"id":21,"module":"压力与失控","dimension":"压力与失控","text":"事情同时失控：工作出错、行程延误、手机快没电。你会？","options":[{"key":"A","text":"按影响排序处理，并把可委托的部分交出去","score":"SECURE"},{"key":"B","text":"全部自己抓住，不允许任何人插手添乱","score":"ARMOR"},{"key":"C","text":"立刻联系最信任的人，希望对方告诉你先做什么","score":"ANCHOR"},{"key":"D","text":"先硬撑，情绪上来后又突然很想有人接管","score":"SWING"}]},{"id":22,"module":"压力与失控","dimension":"压力与失控","text":"你连续忙了两周，身体已经明显疲惫。你最可能？","options":[{"key":"A","text":"继续维持正常表现，倒下之前都不会主动说","score":"ARMOR"},{"key":"B","text":"很希望有人看见并劝你休息，否则停不下来","score":"ANCHOR"},{"key":"C","text":"一天想请假，一天又觉得自己还能扛","score":"SWING"},{"key":"D","text":"调整安排，必要时说明状态并减少非核心任务","score":"SECURE"}]},{"id":23,"module":"压力与失控","dimension":"压力与失控","text":"一个重要计划失败了，你最需要的恢复方式是？","options":[{"key":"A","text":"反复和亲近的人聊，直到重新获得信心","score":"ANCHOR"},{"key":"B","text":"先消失几天，缓过来后又突然想要很多陪伴","score":"SWING"},{"key":"C","text":"先稳定作息和情绪，再复盘可控部分与下一步","score":"SECURE"},{"key":"D","text":"关掉所有人的安慰，马上找下一件事证明自己","score":"ARMOR"}]},{"id":24,"module":"压力与失控","dimension":"压力与失控","text":"如果有人夸你“真的很独立”，你内心最真实的一句是？","options":[{"key":"A","text":"看面对谁吧，有时很独立，有时完全不是","score":"SWING"},{"key":"B","text":"我能照顾自己，也知道什么时候让别人帮忙","score":"SECURE"},{"key":"C","text":"不是我想独立，是我早就不敢指望谁","score":"ARMOR"},{"key":"D","text":"其实有人在身边，我才更敢做很多事","score":"ANCHOR"}]}],"results":{"SECURE":{"typeName":"真独立·稳定自主型","subtitle":"能自己做决定，也允许可靠的人靠近","posterSubtext":"你的独立有门，也有窗","maturityScore":91,"coreConclusion":"你真正拥有的不是“谁都不需要”，而是选择权：能独处、能连接、能求助，也能为自己的决定负责。","diagnosis":"你通常不会把求助等同于软弱，也不会因为有人陪伴就交出人生方向。遇到问题时，你会先判断自己能处理到哪一步，再把具体需要说清楚。你可以依赖关系，但不靠关系证明自己的价值。这种独立最稳定，因为它不是靠切断需要维持的。","whatYouReallyWant":"既保留自己的节奏和判断，也能在关系里得到真实支持。你不追求永远强大，更在意彼此可靠、边界清楚。","mechanism":{"title":"有弹性的自主","content":"你的核心机制是“我可以选择”。你会区分能力、责任和支持：自己的决定自己承担，需要协作时也愿意开口。"},"professionalBasis":"从依恋与自我决定视角看，成熟独立同时包含自主、胜任感和连接感。能接受帮助而不失去主体性，通常比长期硬扛更稳定。","coreTensions":["容易被默认成“最省心的人”，不知不觉承担过多","习惯先处理问题，偶尔会让自己的情绪排到最后","面对反复失信的人，可能给出太多一次机会"],"suitableIf":["需要独立判断又要高质量协作的工作","尊重边界、允许彼此有空间的关系","目标明确、责任分配清楚的长期计划"],"cautionIf":["别人把你的可靠当作无限容量","你一直在解决事情，却很久没被照顾","关系只剩功能合作，缺少真实感受"],"indices":[{"label":"自主决策","value":92},{"label":"求助弹性","value":87},{"label":"情绪自持","value":84},{"label":"独处舒适","value":88}],"ifStay":"继续保持：把“我能处理”升级成“我愿意处理多少”。可靠不等于永远有空，成熟也不等于没有需要。","ifChange":"进一步升级：在关系中更早表达偏好和疲惫，不要等到自己已经安排好一切，才给别人参与的机会。","notRecommended":["用“我都可以”掩盖真实偏好","替别人收拾所有后果","把稳定表现成永远不需要安慰"],"plan90":[{"title":"第1周：说出偏好","content":"每天至少一次，把“都行”换成一个具体选择。"},{"title":"第2周：校准责任","content":"列出一件你正在替别人承担、但其实可以归还的事。"},{"title":"第3-4周：练习被支持","content":"向可靠的人提出一个明确、可完成的小请求，并允许对方参与。"}],"closing":"真正的独立不是没有软肋，而是即使承认需要，你也没有失去自己。"},"ARMOR":{"typeName":"假独立·铠甲硬撑型","subtitle":"不是不需要，而是不敢把需要交出去","posterSubtext":"你最强硬的地方，藏着最怕落空的期待","maturityScore":76,"coreConclusion":"你看起来最独立的时刻，往往也是你最不想再次体验失望的时刻。","diagnosis":"你习惯先说“不用”，把困难拆小、把情绪收好，再一个人扛过去。别人可能觉得你省心、果断、能力强，只有你知道这份独立里混着警惕：如果开口被拒绝，比从来不期待更难受。于是你用不麻烦任何人，换取不被任何人拿捏。","whatYouReallyWant":"你真正想要的不是完全没人靠近，而是有人能稳定出现，不让你为一次求助付出解释、亏欠或失望的代价。","mechanism":{"title":"防御性自给","content":"你的保护逻辑是“只要我不需要，就没人能让我失望”。它曾帮助你活得有掌控感，但也会让别人误以为你真的不需要支持。"},"professionalBasis":"防御性独立常见于早期需要得不到稳定回应、求助被否定，或长期承担者角色。它不是能力不足，而是通过压低期待来降低受伤概率。","coreTensions":["越累越沉默，直到突然抽离或爆发","希望别人主动看见，却会否认自己的需要","接受帮助时容易产生亏欠感，随后急着偿还"],"suitableIf":["需要短期独立推进和抗压的任务","边界清楚、不强迫你交代情绪的关系","允许逐步建立信任的合作环境"],"cautionIf":["所有求助都被你自动翻译成“麻烦别人”","身体已经疲惫，嘴上仍然只会说没事","别人靠近时，你先寻找对方以后会离开的证据"],"indices":[{"label":"自主决策","value":89},{"label":"求助弹性","value":34},{"label":"情绪自持","value":71},{"label":"独处舒适","value":78}],"ifStay":"继续硬撑：短期会保持高效率，长期却容易积累疲惫与隐性委屈，让关系只能看见你的能力，看不见你本人。","ifChange":"把铠甲开一条缝：不用一次交出全部脆弱。先从低风险、具体、可拒绝的小请求开始，重新收集“有人能接住”的证据。","notRecommended":["用突然消失代替表达失望","测试别人能否猜中你的需要","把接受帮助理解成欠下人情"],"plan90":[{"title":"第1周：识别假性没事","content":"每次说“没事”前停三秒，确认自己是真的没事，还是不想麻烦人。"},{"title":"第2周：小额求助","content":"提出一个十分钟内能完成的具体请求，不附带道歉和过度解释。"},{"title":"第3-4周：表达不逞强","content":"对一个可靠的人说清一次“我能处理，但我希望你陪我一下”。"}],"closing":"你当然能一个人走，只是以后不必再用孤单证明自己有力量。"},"ANCHOR":{"typeName":"半独立·关系借力型","subtitle":"能力并不弱，但重要时刻需要关系确认","posterSubtext":"你常在别人的回应里确认自己的方向","maturityScore":72,"coreConclusion":"你并非没有主见，只是在不确定、受伤或重大决定前，会本能地借用关系获得安全感。","diagnosis":"日常小事你可以处理得很好，一到重要选择或关系波动，你就容易反复询问、等待回应，甚至把“对方是否支持”当成决定本身。你真正依赖的未必是别人替你解决问题，而是被确认、被陪伴之后，你才敢相信自己的判断。","whatYouReallyWant":"有人站在你身边，让你知道即使选错也不会被丢下；同时，你也希望慢慢拥有不靠外界许可就能行动的底气。","mechanism":{"title":"关系性稳压","content":"你的情绪系统很擅长通过连接恢复稳定。优势是会合作、会表达；风险是把陪伴需求误写成决策授权。"},"professionalBasis":"人本来就需要连接。问题不在于依赖，而在于是否保留选择权。健康互依允许求助，同时仍由自己评估、决定并承担结果。","coreTensions":["别人回复慢时，容易怀疑自己是不是做错了","为了维持连接，可能提前放弃真实偏好","面对多个意见，会越来越听不见自己的声音"],"suitableIf":["反馈及时、沟通透明的团队","愿意回应情绪但不替你做决定的伴侣","有阶段复盘和陪跑机制的成长计划"],"cautionIf":["每个决定都要获得多人同意才安心","对方冷淡后，你连原本擅长的事也开始怀疑","为了不失去关系，不断修改自己的底线"],"indices":[{"label":"自主决策","value":56},{"label":"求助弹性","value":88},{"label":"情绪自持","value":49},{"label":"独处舒适","value":46}],"ifStay":"继续借力：你会保持高连接感，但遇到不稳定关系时，情绪和行动都容易被对方的回应牵动。","ifChange":"把支持和许可分开：可以请人陪你梳理，但最终用自己的标准做决定。先写答案，再听意见，最后记录是谁承担结果。","notRecommended":["把“你觉得呢”变成所有决定的开头","用即时回复证明自己被重视","为了被留下而答应不愿意的事"],"plan90":[{"title":"第1周：先写自己的答案","content":"咨询别人前，先写下你的首选、理由和最坏结果。"},{"title":"第2周：延迟确认","content":"想反复询问时先等20分钟，观察焦虑是否会自然下降。"},{"title":"第3-4周：独立完成小决定","content":"每周做一个不向任何人报备的小选择，并复盘结果而非寻求评价。"}],"closing":"你可以需要别人，但不必把自己的人生方向也一并交出去。"},"SWING":{"typeName":"摇摆独立·情境切换型","subtitle":"平时能独立，失控或亲密时会切换模式","posterSubtext":"你的独立取决于场景，也取决于面对谁","maturityScore":82,"coreConclusion":"你既有独立能力，也有连接需要；真正困扰你的不是二选一，而是不同场景下切换得太快。","diagnosis":"工作和日常事务里，你往往清醒、能干、讲效率；一旦进入亲密关系、重大风险或连续受挫，你可能突然变得很需要确认，或者反过来彻底关掉需要。别人会觉得你有时很稳、有时难靠近，其实是安全感不同，调用的应对模式也不同。","whatYouReallyWant":"既不被关系吞没，也不必每次都退回一个人。你需要的是更稳定的内在判断，以及可以被预期的求助和边界方式。","mechanism":{"title":"条件式自主","content":"你的独立不是假的，而是受压力、对象与熟悉度影响。安全时能连接，受威胁时可能在黏住和抽离之间切换。"},"professionalBasis":"自主感会随情境波动。识别触发条件，比给自己贴“独立”或“依赖”标签更有用。稳定来自提前设计应对方式，而非要求自己永远同一种状态。","coreTensions":["陌生关系里很稳，越在乎的人面前越容易失衡","一边想被理解，一边嫌解释自己太麻烦","压力小时能求助，压力大时反而封闭或抓紧"],"suitableIf":["允许调整节奏、能提前约定沟通方式的关系","任务明确但保留自主空间的工作","能用书面记录帮助你稳定判断的决策环境"],"cautionIf":["一受伤就从全盘依赖切换到彻底断联","把某个人的回应当成当天状态的总开关","每次情绪过去后都否认当时真实存在的需要"],"indices":[{"label":"自主决策","value":78},{"label":"求助弹性","value":66},{"label":"情绪自持","value":58},{"label":"独处舒适","value":72}],"ifStay":"继续随情境切换：你能应付多数生活，但重要关系会感到难以预测，也容易误解你的突然靠近或突然退开。","ifChange":"建立固定切换规则：提前写下：什么情况自己处理、什么情况求助、多久没有改善就升级支持。让方法替你在情绪高峰做决定。","notRecommended":["情绪最强时做永久性决定","把今天想独处解释成永远不需要关系","靠冷热变化测试别人是否在乎"],"plan90":[{"title":"第1周：画触发地图","content":"记录三次“突然想靠近或退开”的时刻，标出对象、压力和身体感觉。"},{"title":"第2周：固定求助句式","content":"准备一句可复用的话：“我现在需要的是陪伴/建议/具体帮忙中的一种。”"},{"title":"第3-4周：延迟大动作","content":"想断联、辞掉或立刻承诺时，至少睡一晚，再用书面标准重新评估。"}],"closing":"稳定不是永远独自站着，而是无论靠近还是退开，你都知道自己为什么。"}}};</script>
