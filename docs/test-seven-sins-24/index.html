投入，哪里还有更好位置","weights":{"GREED":3,"GLUTTONY":1}},{"key":"D","text":"表面没事，回去后越想越堵，忍不住比较两个人的待遇","weights":{"ENVY":3,"GREED":1}}]},{"id":3,"module":"01 · 被看见","text":"有人夸你“最近状态真好”，哪种后续最容易发生？","options":[{"key":"A","text":"很享受那个目光，之后会更在意穿着、气氛和吸引力","weights":{"LUST":3,"PRIDE":1}},{"key":"B","text":"顺势奖励自己一顿好的或买点喜欢的，把愉快延长","weights":{"GLUTTONY":3,"LUST":1}},{"key":"C","text":"嘴上说还好，心里会确认：果然我一直有自己的水平","weights":{"PRIDE":3,"ENVY":1}},{"key":"D","text":"短暂开心后又想到更亮眼的人，觉得自己还差一点","weights":{"ENVY":3,"GREED":1}}]},{"id":4,"module":"01 · 被看见","text":"连续忙了很久，却没人注意到你的付出。你最容易变成哪种状态？","options":[{"key":"A","text":"突然不想再证明了，能少做一点就少做一点","weights":{"SLOTH":3,"ENVY":1}},{"key":"B","text":"积累到某一刻直接爆发：凭什么所有人都默认我能扛","weights":{"WRATH":3,"PRIDE":1}},{"key":"C","text":"开始争取更明确的回报、头衔或资源，不再只讲情怀","weights":{"GREED":3,"GLUTTONY":1}},{"key":"D","text":"会特别在意谁被表扬、谁得到照顾，越看越不平衡","weights":{"ENVY":3,"GREED":1}}]},{"id":5,"module":"02 · 资源与拥有","text":"突然多出一笔可自由支配的钱，你最想先做什么？","options":[{"key":"A","text":"把它变成存款、工具或下一次机会，让手里的筹码更多","weights":{"GREED":3,"GLUTTONY":1}},{"key":"B","text":"买一件能明显提升气场和吸引力的东西","weights":{"LUST":3,"PRIDE":1}},{"key":"C","text":"认真吃喝玩乐一次，先把这段时间亏欠自己的补回来","weights":{"GLUTTONY":3,"LUST":1}},{"key":"D","text":"暂时不处理，光想到要比较和选择就觉得累","weights":{"SLOTH":3,"ENVY":1}}]},{"id":6,"module":"02 · 资源与拥有","text":"你最难放下的一类东西更像？","options":[{"key":"A","text":"能证明自己品位、水平或身份的东西","weights":{"PRIDE":3,"ENVY":1}},{"key":"B","text":"也许以后会用到的资源、文件、优惠和人脉","weights":{"GREED":3,"GLUTTONY":1}},{"key":"C","text":"承载快乐体验的味道、礼物、照片和纪念品","weights":{"GLUTTONY":3,"LUST":1}},{"key":"D","text":"别人有而自己没有的那一类，明知不需要也会惦记","weights":{"ENVY":3,"GREED":1}}]},{"id":7,"module":"02 · 资源与拥有","text":"看到限量商品只剩最后一件，你更容易被什么推动？","options":[{"key":"A","text":"“别人买不到而我有”，这种稀缺感很迷人","weights":{"PRIDE":3,"ENVY":1}},{"key":"B","text":"错过可能更贵，先拿下再说，机会不能白白流走","weights":{"GREED":3,"GLUTTONY":1}},{"key":"C","text":"它真的好看，拥有后会让自己更有魅力","weights":{"LUST":3,"PRIDE":1}},{"key":"D","text":"下单那一刻很爽，像终于给疲惫生活加了一口糖","weights":{"GLUTTONY":3,"LUST":1}}]},{"id":8,"module":"02 · 资源与拥有","text":"朋友借走你的东西迟迟不还，你的情绪最接近？","options":[{"key":"A","text":"越界感很强，会直接催还并重新设规则","weights":{"WRATH":3,"PRIDE":1}},{"key":"B","text":"会想以后减少往来，这个人不值得再得到你的好东西","weights":{"PRIDE":3,"ENVY":1}},{"key":"C","text":"先记着，等下次对方再求助时重新计算交换","weights":{"GREED":3,"GLUTTONY":1}},{"key":"D","text":"嫌追问麻烦，拖着拖着又会暗自不舒服","weights":{"SLOTH":3,"ENVY":1}}]},{"id":9,"module":"03 · 关系与吸引","text":"暧昧对象忽然变冷，你最先启动的反应更像？","options":[{"key":"A","text":"想恢复吸引力，让对方重新主动靠近","weights":{"LUST":3,"PRIDE":1}},{"key":"B","text":"忍不住对照是不是出现了更有魅力的人","weights":{"ENVY":3,"GREED":1}},{"key":"C","text":"直接问清楚，不接受忽冷忽热吊着自己","weights":{"WRATH":3,"PRIDE":1}},{"key":"D","text":"把聊天放着，觉得追问和解释都太消耗","weights":{"SLOTH":3,"ENVY":1}}]},{"id":10,"module":"03 · 关系与吸引","text":"一段关系里，什么最容易让你上头？","options":[{"key":"A","text":"对方强烈地欣赏你，让你觉得自己无可替代","weights":{"PRIDE":3,"ENVY":1}},{"key":"B","text":"外形、气味、声音和靠近时的化学反应","weights":{"LUST":3,"PRIDE":1}},{"key":"C","text":"对方能带你进入更大的世界，资源和可能性都变多","weights":{"GREED":3,"GLUTTONY":1}},{"key":"D","text":"被照顾、被投喂、一起舒服地享受日常","weights":{"GLUTTONY":3,"LUST":1}}]},{"id":11,"module":"03 · 关系与吸引","text":"恋人夸别人很优秀，你最难控制的念头是？","options":[{"key":"A","text":"会想证明自己更特别，不愿在比较里落下风","weights":{"PRIDE":3,"ENVY":1}},{"key":"B","text":"会注意对方是不是对那个人有吸引和兴趣","weights":{"LUST":3,"PRIDE":1}},{"key":"C","text":"脑内立刻开始比较，越想越容易看见自己的不足","weights":{"ENVY":3,"GREED":1}},{"key":"D","text":"如果语气越界，会当场表达不满，不想装大度","weights":{"WRATH":3,"PRIDE":1}}]},{"id":12,"module":"03 · 关系与吸引","text":"关系进入平淡期，你最可能怎样处理？","options":[{"key":"A","text":"制造一点新的约会和亲密感，让火花回来","weights":{"LUST":3,"PRIDE":1}},{"key":"B","text":"安排一顿好的或一次旅行，用共同享受重新连接","weights":{"GLUTTONY":3,"LUST":1}},{"key":"C","text":"想谈清楚双方投入，不能总由一个人维持","weights":{"GREED":3,"GLUTTONY":1}},{"key":"D","text":"明知该沟通，却常常拖到两个人都越来越没话","weights":{"SLOTH":3,"ENVY":1}}]},{"id":13,"module":"04 · 压力与失衡","text":"一个计划受阻时，你最容易出现哪种反应？","options":[{"key":"A","text":"火气一下上来，先想找出是谁挡住了推进","weights":{"WRATH":3,"PRIDE":1}},{"key":"B","text":"觉得别人效率太低，还是自己来才靠得住","
