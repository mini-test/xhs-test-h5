mension":"定位清晰度","text":"连续见了几个人都没有后续，你最先复盘的是：","options":[{"key":"A","text":"算了，可能我就不适合进入关系","score":"RESTORE"},{"key":"B","text":"这批人的质量不够，再提高筛选门槛","score":"SELECT"},{"key":"C","text":"是不是我表现得太平淡，让人看不出兴趣","score":"QUIET"},{"key":"D","text":"我的筛选标准、表达方式和对象来源是否匹配","score":"STABLE"}]},{"id":5,"module":"关系准备度","dimension":"关系准备度","text":"对方开始频繁联系，还主动规划周末，你的第一反应更像：","options":[{"key":"A","text":"感受不错就回应，同时保留自己的生活节奏","score":"STABLE"},{"key":"B","text":"心里开心，但表面仍然很克制","score":"QUIET"},{"key":"C","text":"先观察对方是否稳定，不急着投入","score":"SELECT"},{"key":"D","text":"突然有压力，想把距离重新拉开","score":"RESTORE"}]},{"id":6,"module":"关系准备度","dimension":"关系准备度","text":"认识一个月后，对方问你是否愿意认真发展，你会：","options":[{"key":"A","text":"愿意，但会说再等等，怕显得太主动","score":"QUIET"},{"key":"B","text":"含糊带过，不想面对关系升级","score":"RESTORE"},{"key":"C","text":"根据真实感受回答，并讨论彼此期待","score":"STABLE"},{"key":"D","text":"继续考察，除非对方已经证明各方面都合格","score":"SELECT"}]},{"id":7,"module":"关系准备度","dimension":"关系准备度","text":"忙碌的一周里，原定约会临时需要改期，你更可能：","options":[{"key":"A","text":"工作更重要，对方能理解才适合长期相处","score":"SELECT"},{"key":"B","text":"说明原因并立刻给出新的可选时间","score":"STABLE"},{"key":"C","text":"松一口气，顺势把见面无限往后拖","score":"RESTORE"},{"key":"D","text":"先道歉，等对方再来约自己","score":"QUIET"}]},{"id":8,"module":"关系准备度","dimension":"关系准备度","text":"想到一段稳定关系，你最真实的感受是：","options":[{"key":"A","text":"想要陪伴，又害怕它会消耗我的精力","score":"RESTORE"},{"key":"B","text":"可以，但不能因此降低生活质量和标准","score":"SELECT"},{"key":"C","text":"很向往，但担心自己不够会经营","score":"QUIET"},{"key":"D","text":"期待亲密，也接受需要协商和承担","score":"STABLE"}]},{"id":9,"module":"沟通稳定度","dimension":"沟通稳定度","text":"原本聊得不错的人，回复突然变慢，你通常会：","options":[{"key":"A","text":"先观察节奏，必要时直接确认对方近况","score":"STABLE"},{"key":"B","text":"反复看聊天记录，却不愿先开口","score":"QUIET"},{"key":"C","text":"迅速降级对方，认为不够重视就没必要继续","score":"SELECT"},{"key":"D","text":"情绪被牵动，干脆也消失保护自己","score":"RESTORE"}]},{"id":10,"module":"沟通稳定度","dimension":"沟通稳定度","text":"第一次出现明显意见不合，你更自然的做法是：","options":[{"key":"A","text":"先让过去，等气氛好时再委婉提起","score":"QUIET"},{"key":"B","text":"不想争，表面没事，心里开始后退","score":"RESTORE"},{"key":"C","text":"说清自己的理由，也确认对方在意什么","score":"STABLE"},{"key":"D","text":"判断这是原则差异还是认知差距","score":"SELECT"}]},{"id":11,"module":"沟通稳定度","dimension":"沟通稳定度","text":"对方一句无心的话让你不舒服，你会：","options":[{"key":"A","text":"记在心里，继续观察是不是人格问题","score":"SELECT"},{"key":"B","text":"描述具体感受，并告诉对方希望怎么沟通","score":"STABLE"},{"key":"C","text":"立刻冷下来，让对方自己猜原因","score":"RESTORE"},{"key":"D","text":"忍一忍，怕说出来显得自己太敏感","score":"QUIET"}]},{"id":12,"module":"沟通稳定度","dimension":"沟通稳定度","text":"约会后对方说“挺好的，可以再了解”，你会理解为：","options":[{"key":"A","text":"关系太难猜了，暂时不想继续投入","score":"RESTORE"},{"key":"B","text":"兴趣不够明确，先把注意力转向别人","score":"SELECT"},{"key":"C","text":"是不是客套话，自己哪里没表现好","score":"QUIET"},{"key":"D","text":"中性积极信号，继续看后续行动","score":"STABLE"}]},{"id":13,"module":"生活协作力","dimension":"生活协作力","text":"你发现两个人的花钱习惯差异很大，最可能：","options":[{"key":"A","text":"聊预算、优先级和双方都能接受的规则","score":"STABLE"},{"key":"B","text":"先配合对方，担心谈钱破坏感情","score":"QUIET"},{"key":"C","text":"把消费观视为硬门槛，差太多就及时止损","score":"SELECT"},{"key":"D","text":"回避讨论，等真正发生矛盾再说","score":"RESTORE"}]},{"id":14,"module":"生活协作力","dimension":"生活协作力","text":"工作很累，但你已经答应今晚见面，你会：","options":[{"key":"A","text":"硬撑着赴约，不想让对方失望","score":"QUIET"},{"key":"B","text":"临近出门才取消，已经没有力气解释","score":"RESTORE"},{"key":"C","text":"评估状态，能见就见，不能就认真改约","score":"STABLE"},{"key":"D","text":"按自己的计划走，不接受临时情绪影响安排","score":"SELECT"}]},{"id":15,"module":"生活协作力","dimension":"生活协作力","text":"对方遇到现实麻烦，需要你提供支持，你更接近：","options":[{"key":"A","text":"先判断对方是否有解决问题的能力","score":"SELECT"},{"key":"B","text":"先问清需要，再决定能提供到什么程度","score":"STABLE"},{"key":"C","text":"容易被压垮，想暂时躲开这件事","score":"RESTORE"},{"key":"D","text":"即使勉强也先答应，怕对方失望","score":"QUIET"}]},{"id":16,"module":"生活协作力","dimension":"生活协作力","text":"关系稳定后谈到家务、照顾父母和未来分工，你会：","options":[{"key":"A","text":"觉得太现实，聊这些会让自己想逃","score":"RESTORE"},{"key":"B","text":"先确认对方能承担多少，再决定是否继续","score":"SELECT"},{"key":"C","text":"希望对方主动体谅，不太好意思细分","score":"QUIET"},{"key":"D","text":"把具体任务和边界提前谈清楚","score":"STABLE"}]},{"id":17,"module":"主动呈现力","dimension":"主动呈现力","text":"别人评价你“条件不差，但看不出你想谈恋爱”，你会：","options":[{"key":"A","text":"调整表达，让感兴趣的人能收到明确信号","score":"STABLE"},{"key":"B","text":"觉得被说中了，但还是不习惯展示需求","score":"QUIET"},{"key":"C","text":"真正合适的人应该能看懂，不必刻意表现","score":"SELECT"},{"key":"D","text":"索性承认自己现在没有精力投入","score":"RESTORE"}]},{"id":18,"module":"主动呈现力","dimension":"主动呈现力","text":"介绍人问“你最大的相处优势是什么”，你更可能：","options":[{"key":"A","text":"说没什么特别的，不想显得在推销自己","score":"QUIET"},{"key":"B","text":"不知道怎么回答，甚至有点反感这个问题","score":"RESTORE"},{"key":"C","text":"举出具体例子，说清自己能给关系什么","score":"STABLE"},{"key":"D","text":"强调自己的硬条件和稀缺优势","score":"SELECT"}]},{"id":19,"module":"主动呈现力","dimension":"主动呈现力","text":"遇到一个让你有好感的人，你通常会：","options":[{"key":"A","text":"先验证对方条件和诚意，再决定是否释放信号","score":"SELECT"},{"key":"B","text":"自然增加互动，给对方靠近的机会","score":"STABLE"},{"key":"C","text":"越喜欢越紧张，反而表现得疏远","score":"RESTORE"},{"key":"D","text":"等对方明确主动，自己只做轻微回应","score":"QUIET"}]},{"id":20,"module":"主动呈现力","dimension":"主动呈现力","text":"第一次约会没有强烈火花，但相处舒服，你会：","options":[{"key":"A","text":"不做决定，任由联系慢慢断掉","score":"RESTORE"},{"key":"B","text":"吸引力不足就不再投入时间","score":"SELECT"},{"key":"C","text":"想继续，却等对方先发下一次邀请","score":"QUIET"},{"key":"D","text":"给关系一个小周期，看吸引力是否增长","score":"STABLE"}]},{"id":21,"module":"边界筛选力","dimension":"边界筛选力","text":"对方踩到你已经说过的明确底线，你会：","options":[{"key":"A","text":"指出事实和后果，观察对方是否真正修正","score":"STABLE"},{"key":"B","text":"再给一次机会，希望对方自己意识到","score":"QUIET"},{"key":"C","text":"立即结束，不再提供解释空间","score":"SELECT"},{"key":"D","text":"嘴上说没关系，之后却越来越冷淡","score":"RESTORE"}]},{"id":22,"module":"边界筛选力","dimension":"边界筛选力","text":"一个人条件很耀眼，但每次相处都让你持续紧绷，你会：","options":[{"key":"A","text":"怀疑是不是自己要求太多，再忍一阵","score":"QUIET"},{"key":"B","text":"既舍不得条件，又不想靠近，反复拉扯","score":"RESTORE"},{"key":"C","text":"相信长期感受，重新评估这段匹配","score":"STABLE"},{"key":"D","text":"如果回报足够高，可以暂时承受不舒服","score":"SELECT"}]},{"id":23,"module":"边界筛选力","dimension":"边界筛选力","text":"家人非常满意一个对象，但你相处时并不自在，你会：","options":[{"key":"A","text":"梳理对方硬条件，再判断不自在是否能克服","score":"SELECT"},{"key":"B","text":"认真听建议，但最终以自己的真实体验决定","score":"STABLE"},{"key":"C","text":"谁都不想得罪，只能一直拖着不表态","score":"RESTORE"},{"key":"D","text":"继续接触，怕自己的感觉不够客观","score":"QUIET"}]},{"id":24,"module":"边界筛选力","dimension":"边界筛选力","text":"认识三个月，对方仍不愿确认关系，你会：","options":[{"key":"A","text":"一边焦虑一边维持现状，很难真的离开","score":"RESTORE"},{"key":"B","text":"降低投入，同时寻找更明确的选择","score":"SELECT"},{"key":"C","text":"继续等待，担心追问会把人推远","score":"QUIET"},{"key":"D","text":"明确询问意愿，并为自己设定可接受期限","score":"STABLE"}]}],"results":{"STABLE":{"typeName":"稳定匹配型·清晰进入者","subtitle":"你不是“分数最高”，而是更知道如何识别并经营合适的关系","posterSubtext":"优势能被看见，边界也经得起靠近","maturityScore":91,"coreConclusion":"你的当前相亲定位比较清晰：知道自己要什么，也能让别人理解你能提供什么。你真正的优势并非某一项硬条件，而是筛选、表达和协作形成了闭环。","diagnosis":"你在关系推进中既不会过度迎合，也不会只凭一时心动做决定。面对不确定，你倾向于获取信息、直接沟通，再根据持续体验调整投入。这样的节奏会让适合你的人更容易留下。","whatYouReallyWant":"理想型画像：情绪稳定、愿意沟通、生活方向相近的人。底线型画像：尊重边界、行动一致、遇事不逃避。你要的不是完美条件，而是一个能共同解决现实问题的人。","mechanism":{"title":"清晰不是挑剔，而是把标准分层","content":"你能够区分核心需求、加分项和暂时差异，因此既不容易错过潜力对象，也不太会被耀眼条件带偏。需要留意的是，过于成熟的表达偶尔会让约会少一点轻松感。"},"professionalBasis":["定位清晰：能把偏好转化为可观察的相处标准。","关系准备：既期待亲密，也接受关系需要投入和协商。","双画像：理想型决定上限，底线型守住长期安全。"],"coreTensions":["效率筛选与自然心动","独立节奏与共同规划","明确边界与柔软表达"],"suitableIf":["价值观稳定且愿意谈现实安排的人","行动一致、能表达需求的人","拥有独立生活同时愿意共同建设的人"],"cautionIf":["只会展示硬条件、回避情绪交流的人","长期模糊关系却要求你持续投入的人"],"indices":[{"label":"定位清晰","value":93},{"label":"关系准备","value":90},{"label":"沟通稳定","value":91},{"label":"责任协作","value":88},{"label":"主动呈现","value":86},{"label":"边界筛选","value":94}],"ifStay":"继续现在的方式，你大概率能保持较高的匹配质量，但需要给初期关系一点轻松和自然生长的空间。","ifChange":"如果增加一些好奇、玩心和情绪表达，你会从“可靠合适”变成“既合适又让人想靠近”。","notRecommended":["把每次约会都变成面试","为了效率过早定义对方","只复盘对错，不表达喜欢"],"plan90":[{"title":"第1周·校准","content":"把标准写成3条核心需求、3条加分项、3条底线。"},{"title":"第2周·表达","content":"练习用具体例子介绍自己的相处优势。"},{"title":"第3-4周·验证","content":"对有潜力的人至少观察三次稳定行动再下结论。"}],"closing":"你不需要证明自己值多少分。真正有用的，是让合适的人看懂你的价值，也让不合适的人尽早离开。"},"QUIET":{"typeName":"低曝光潜力型·优势待看见","subtitle":"不是条件不够，而是你的好常常要相处很久才会被发现","posterSubtext":"内在分不低，外显信号偏弱","maturityScore":76,"coreConclusion":"你的“当前定位分”被主动呈现拖住了。你通常认真、细腻、愿意照顾关系，但在刚认识阶段容易显得平淡或没有兴趣，导致别人还没走近就失去判断依据。","diagnosis":"你不缺关系能力，缺的是把关系能力翻译成可被感知的信号。你习惯等对方先明确、先投入、先证明，自己才敢往前一步。这能保护你，却也会让同样谨慎的人与你擦肩而过。","whatYouReallyWant":"理想型画像：耐心、细腻、能看见你慢热价值的人。底线型画像：不会逼迫表态，也不会用忽冷忽热制造不安。你希望先安全，再心动。","mechanism":{"title":"低曝光不是低价值","content":"慢热者的优势常出现在关系中后期：稳定、记得细节、能持续支持。但相亲的前几次见面信息有限，如果你完全不释放兴趣，对方只能把沉默解释为拒绝。"},"professionalBasis":["内在优势需要外显证据，否则无法进入匹配判断。","温和回应不等于倒贴，主动也不等于失去选择权。","安全感可以边行动边建立，不必等到完全确定。"],"coreTensions":["想被看见与害怕暴露","愿意靠近与等待确认","真实慢热与过度被动"],"suitableIf":["回应稳定、愿意循序渐进的人","重视细节而非只追求强刺激的人","表达直接但尊重节奏的人"],"cautionIf":["把你的沉默当作无限付出许可的人","只享受追逐、不愿稳定回应的人"],"indices":[{"label":"定位清晰","value":76},{"label":"关系准备","value":80},{"label":"沟通稳定","value":78},{"label":"责任协作","value":86},{"label":"主动呈现","value":54},{"label":"边界筛选","value":72}],"ifStay":"如果维持现在的表达方式，你仍会遇到欣赏你的人，但需要更长筛选周期，也更依赖对方的主动。","ifChange":"只要把兴趣表达提升一小格，你的匹配面会明显扩大，不必改变慢热本身。","notRecommended":["让别人全靠猜","把不主动当作自尊","喜欢却故意表现冷淡"],"plan90":[{"title":"第1周·识别","content":"写下你能给关系的三个具体优点。"},{"title":"第2周·微主动","content":"对有好感的人主动提出一次具体邀约。"},{"title":"第3-4周·反馈","content":"约会后明确表达“我愿意继续了解”，不做模糊测试。"}],"closing":"你的好不必变得高调，只需要变得可见。"},"SELECT":{"typeName":"高标准筛选型·匹配半径偏窄","subtitle":"你很会判断条件，却可能把“适合”筛成了“必须完美”","posterSubtext":"标准清晰，容错空间偏小","maturityScore":81,"coreConclusion":"你的优势是判断快、底线稳、不容易被短期热情冲昏头脑；拖分项则是条件权重过密，容易在关系还没展示真实质感前就结束评估。","diagnosis":"你希望降低试错成本，于是会通过学历、收入、城市、外形、家庭和表达方式快速建立判断。问题不在标准高，而在部分标准可能只是安全感的替代品，并不真正决定长期幸福。","whatYouReallyWant":"理想型画像：能力与生活方式都能与你并肩的人。底线型画像：诚实、稳定、有责任感，不让你承担失控风险。你追求的是确定感，不只是高配置。","mechanism":{"title":"标准越多，不等于匹配越准","content":"筛选能够保护时间，但硬条件只能预测部分生活兼容性。相处安全、冲突修复、责任感和成长性，需要在互动中观察。把所有不确定都提前排除，可能也排除了关系生长的空间。"},"professionalBasis":["核心标准应与长期生活直接相关。","加分项不宜伪装成底线。","对潜力对象进行小样本验证，比第一轮全盘否定更准确。"],"coreTensions":["高质量期待与现实样本","风险控制与关系生长","理想上限与真实红线"],"suitableIf":["自驱、稳定且不惧怕坦诚讨论条件的人","有长期规划又保留情感温度的人","能够用行动证明可靠的人"],"cautionIf":["只靠包装满足硬指标的人","擅长许诺却缺乏持续行动的人"],"indices":[{"label":"定位清晰","value":92},{"label":"关系准备","value":75},{"label":"沟通稳定","value":79},{"label":"责任协作","value":84},{"label":"主动呈现","value":74},{"label":"边界筛选","value":95}],"ifStay":"继续现在的策略，你能有效避开明显不合适的人，但样本会越来越少，且容易错过非典型优质对象。","ifChange":"把一半硬标准改成“可验证问题”，匹配准确度可能反而更高。","notRecommended":["用一个短板否定整个人","把外部评价当作自己的真实需求","追求没有任何风险的关系"],"plan90":[{"title":"第1周·分层","content":"把所有条件分为底线、核心、加分三层。"},{"title":"第2周·换算","content":"将抽象条件改写成可观察行为。"},{"title":"第3-4周·扩圈","content":"给一位符合核心但不完全符合加分项的人三次了解机会。"}],"closing":"你可以有高标准，但最好让每一条标准都真正为你的长期生活服务。"},"RESTORE":{"typeName":"节奏重整型·先恢复再进入","subtitle":"你不是没有缘分，而是当前能用于关系的心理带宽偏低","posterSubtext":"想靠近，也容易在推进时耗尽","maturityScore":63,"coreConclusion":"你目前最需要处理的不是“市场值几分”，而是关系投入能力。你可能想要陪伴，却在真实互动、选择和承诺靠近时感到疲惫，于是拖延、模糊或反复退出。","diagnosis":"这通常不是性格缺陷，而是过去的关系消耗、工作压力或自我怀疑占用了太多心理空间。勉强高频相亲只会增加挫败感。先恢复稳定节奏，再进入筛选，你的真实优势才有机会出现。","whatYouReallyWant":"理想型画像：温和、有耐心、不会以推进速度衡量诚意的人。底线型画像：尊重暂停、言行一致，不用忽冷忽热激活你的焦虑。你需要的是低压但不模糊的靠近。","mechanism":{"title":"准备度不足，会被误解为没有兴趣","content":"当心理带宽不足时，人会本能减少决策、回避冲突和延迟回复。对方看到的是冷淡，你经历的却是耗竭。先恢复日常掌控感，往往比继续增加相亲数量更有效。"},"professionalBasis":["关系准备度是可变化状态，不是永久标签。","暂停不是失败，但需要明确期限和恢复计划。","低压关系仍需基本回应和边界，不能靠消失维持安全。"],"coreTensions":["渴望陪伴与害怕消耗","想要确定与回避选择","自我保护与持续失联"],"suitableIf":["节奏稳定、不催促也不消失的人","能理解压力但不替你承担全部责任的人","愿意从低频高质量互动开始的人"],"cautionIf":["用强烈追逐制造存在感的人","要求快速承诺或持续情绪劳动的人"],"indices":[{"label":"定位清晰","value":61},{"label":"关系准备","value":48},{"label":"沟通稳定","value":58},{"label":"责任协作","value":70},{"label":"主动呈现","value":52},{"label":"边界筛选","value":68}],"ifStay":"继续勉强进入高频相亲，你可能获得更多见面，却更难持续投入，容易把疲惫误判成不适合。","ifChange":"减少数量、提高单次质量并恢复日常能量后，你会更容易判断自己是真的不喜欢，还是只是太累。","notRecommended":["在耗竭期密集见人","用消失代替说明","因为一次失败否定长期可能"],"plan90":[{"title":"第1周·减量","content":"暂停新增安排，梳理最近最耗能的三个来源。"},{"title":"第2周·恢复","content":"固定睡眠、独处和社交边界，让生活先回到可控。"},{"title":"第3-4周·轻量进入","content":"只保留一个高质量了解对象，提前说明自己的联系节奏。"}],"closing":"你不必在最疲惫的时候证明自己值得被爱。先把自己接回来，再决定让谁走近。"}}};</script>
