,"text":"非常符合"}]},{"id":19,"module":"信任与承诺","text":"我相信稳定的感情不需要靠反复证明才能成立。","dimension":"anxiety","reverse":true,"dimensionLabel":"关系焦虑","options":[{"key":"A","text":"非常不符合"},{"key":"B","text":"比较不符合"},{"key":"C","text":"一般 / 说不清"},{"key":"D","text":"比较符合"},{"key":"E","text":"非常符合"}]},{"id":20,"module":"信任与承诺","text":"我能接受适度的相互依赖，不必所有事情都自己扛。","dimension":"avoidance","reverse":true,"dimensionLabel":"亲密回避","options":[{"key":"A","text":"非常不符合"},{"key":"B","text":"比较不符合"},{"key":"C","text":"一般 / 说不清"},{"key":"D","text":"比较符合"},{"key":"E","text":"非常符合"}]},{"id":21,"module":"熟悉后的自己","text":"越亲近，我越容易察觉并放大对方很小的态度变化。","dimension":"anxiety","reverse":false,"dimensionLabel":"关系焦虑","options":[{"key":"A","text":"非常不符合"},{"key":"B","text":"比较不符合"},{"key":"C","text":"一般 / 说不清"},{"key":"D","text":"比较符合"},{"key":"E","text":"非常符合"}]},{"id":22,"module":"熟悉后的自己","text":"关系稳定后，我有时会减少表达，退回自己的世界。","dimension":"avoidance","reverse":false,"dimensionLabel":"亲密回避","options":[{"key":"A","text":"非常不符合"},{"key":"B","text":"比较不符合"},{"key":"C","text":"一般 / 说不清"},{"key":"D","text":"比较符合"},{"key":"E","text":"非常符合"}]},{"id":23,"module":"熟悉后的自己","text":"即使很爱一个人，我仍能保留自己的节奏、朋友和价值感。","dimension":"anxiety","reverse":true,"dimensionLabel":"关系焦虑","options":[{"key":"A","text":"非常不符合"},{"key":"B","text":"比较不符合"},{"key":"C","text":"一般 / 说不清"},{"key":"D","text":"比较符合"},{"key":"E","text":"非常符合"}]},{"id":24,"module":"熟悉后的自己","text":"受伤时，我能说“我需要一点时间，但会回来谈”，而不是冷着消失。","dimension":"avoidance","reverse":true,"dimensionLabel":"亲密回避","options":[{"key":"A","text":"非常不符合"},{"key":"B","text":"比较不符合"},{"key":"C","text":"一般 / 说不清"},{"key":"D","text":"比较符合"},{"key":"E","text":"非常符合"}]}],"scoring":{"mode":"attachment-two-axis","threshold":50,"mixedBand":[42,58],"formula":"(adjustedAverage - 1) / 4 * 100","resultMap":{"low-low":"SECURE","high-low":"ANXIOUS","low-high":"AVOIDANT","high-high":"FEARFUL"},"answerValues":{"A":1,"B":2,"C":3,"D":4,"E":5}},"results":{"SECURE":{"typeName":"安全联结型","subtitle":"亲密里能靠近，也能呼吸","posterSubtext":"你能把喜欢说出来，也能在等待里保留自己的生活。","maturityScore":91,"coreConclusion":"你更容易把亲密理解成连接，而不是考试。关系出现波动时，你会不安，但通常不需要靠追问、冷战或消失来重新获得安全感。","diagnosis":"你能在“我需要你”和“我也能照顾自己”之间来回移动。对方忙碌时，你不急着把沉默解释成拒绝；发生冲突时，你更愿意把问题和人分开。这种稳定并不意味着你永远冷静，而是情绪出现以后，你仍有能力回到沟通。","whatYouReallyWant":"你真正需要的是可协商、可依赖、也允许彼此拥有空间的关系。你在意的不是时时黏在一起，而是对方是否言行一致、是否愿意在问题发生后回来修复。","mechanism":{"title":"联结路径：感受到变化 → 先确认事实 → 表达需要","content":"你较少依靠猜测维持关系，也不必通过撤退证明自己独立。安全感主要来自真实互动和可重复的修复经验。"},"professionalBasis":["你的关系焦虑和亲密回避都相对较低，说明你既能接受依赖，也能保留边界。","安全联结不是天生免疫不安，而是有能力识别情绪、提出需要，并在冲突后恢复联系。"],"coreTensions":["容易承担过多修复责任","可能低估不稳定关系的消耗","习惯讲道理时也要照顾自己的感受"],"suitableIf":["对方愿意回应并共同协商","关系中允许说不与改变计划","冲突后双方都会回来修复"],"cautionIf":["只有你一个人在维持稳定","对方把你的包容当成无限额度","你为了成熟而长期压住愤怒"],"indices":[{"label":"信任恢复力","value":91},{"label":"需要表达力","value":88},{"label":"边界稳定度","value":86},{"label":"冲突修复力","value":92},{"label":"自我安顿力","value":89}],"ifStay":"继续保留清晰表达和现实边界，你会让关系既温暖又有弹性。","ifChange":"当对方长期不回应时，更早承认“不是所有关系都能靠沟通修复”。","notRecommended":["为了显得成熟而永远先理解别人","把反复失约解释成偶然","一个人承担两个人的关系作业"],"plan90":["每周一次说出一个具体需要，不只说“都可以”","记录一次被忽略后的真实感受，再决定是否沟通","区分可修复的失误和持续重复的模式"],"closing":"真正稳定的爱，不是从不摇晃，而是摇晃以后，两个人都知道怎么回来。"},"ANXIOUS":{"typeName":"焦虑确认型","subtitle":"不是爱得太多，是不确定会让你一直找答案","posterSubtext":"你对关系变化很敏锐，沉默常比一句拒绝更难熬。","maturityScore":76,"coreConclusion":"你一旦认真，就会很快把对方放进情绪中心。回应变慢、语气变淡、计划不明确，都可能触发“是不是要失去”的警报。","diagnosis":"你不是故意黏人，而是大脑会优先扫描关系里可能失联的信号。为了让警报停下来，你可能反复确认、解释、追问，或牺牲自己的节奏换取靠近。短期得到回应会立刻轻松，长期却更容易把安全感交给对方的每一次反应。","whatYouReallyWant":"你真正想要的不是二十四小时报备，而是一段不需要反复猜测的关系：喜欢能被说清，忙碌有交代，冲突后不会突然失踪。","mechanism":{"title":"警报循环：察觉变化 → 自动联想失去 → 寻求确认","content":"确认暂时能降低焦虑，但如果只能靠对方即时回应才能平静，大脑会越来越依赖确认。练习的重点不是逼自己不在乎，而是延长从触发到行动之间的距离。"},"professionalBasis":["你的关系焦虑较高、亲密回避较低，说明你愿意靠近，但对被拒绝和失联更敏感。","这种反应常随关系的可预测性变化。稳定回应、明确边界和自我安顿能力都可能让分数移动。"],"coreTensions":["把延迟回复读成感情降温","为留住关系而降低底线","越追问越失去自己的节奏"],"suitableIf":["对方表达稳定且不玩消失","双方能提前说清联系习惯","你的需要可以被听见而非嘲笑"],"cautionIf":["关系长期忽冷忽热","对方用撤回关注控制你","你把全部生活暂停来等一个回复"],"indices":[{"label":"关系信号敏感度","value":94},{"label":"确认需求","value" 重警报：怕失去而靠近 → 怕受伤而撤退","content":"两种动作都在保护你，却可能互相强化。重要的不是选“靠近”还是“离开”，而是先辨认此刻到底是哪一种恐惧在说话。"},"professionalBasis":["你的关系焦虑与亲密回避都较高，说明靠近和远离都可能触发压力。","这不是固定身份。稳定关系经验、创伤知情的自我照顾，以及必要时的专业支持，都可能让保护反应变得更灵活。"],"coreTensions":["很想被懂却习惯说没事","对忽冷忽热尤其容易上头","靠近后开始寻找离开的理由"],"suitableIf":["关系节奏稳定且边界清楚","对方不以追逼或消失处理冲突","你可以分阶段表达而非一次交出全部"],"cautionIf":["关系包含控制、威胁或反复贬低","每次亲密后都出现强烈羞耻与恐慌","用突然断联保护自己又陷入后悔"],"indices":[{"label":"失联警觉度","value":92},{"label":"亲密压力值","value":89},{"label":"情绪摆幅","value":86},{"label":"信任建立速度","value":47},{"label":"修复潜力","value":76}],"ifStay":"继续让两套警报替你做决定，关系会在追与逃之间反复消耗。","ifChange":"先命名恐惧、再选择动作，你会逐渐发现靠近不必以失去自己为代价。","notRecommended":["在触发最强时作永久决定","把所有不安都证明成直觉","在有威胁或暴力的关系里独自承担"],"plan90":["触发时先问：我更怕被丢下，还是更怕被控制","练习一句双向表达：我现在想退开，但我也不想失去连接","选择一个可信赖的人，建立可预测的小承诺并记录兑现"],"closing":"你不是无法去爱，只是过去的保护方式太用力。安全可以一点点重新学习。"}},"secondaryNotes":{"SECURE":{"ANXIOUS":"你的坐标靠近分界线，除了“安全联结型”，也带有“焦虑确认型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","AVOIDANT":"你的坐标靠近分界线，除了“安全联结型”，也带有“独立回撤型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","FEARFUL":"你的坐标靠近分界线，除了“安全联结型”，也带有“靠近警报型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。"},"ANXIOUS":{"SECURE":"你的坐标靠近分界线，除了“焦虑确认型”，也带有“安全联结型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","AVOIDANT":"你的坐标靠近分界线，除了“焦虑确认型”，也带有“独立回撤型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","FEARFUL":"你的坐标靠近分界线，除了“焦虑确认型”，也带有“靠近警报型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。"},"AVOIDANT":{"SECURE":"你的坐标靠近分界线，除了“独立回撤型”，也带有“安全联结型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","ANXIOUS":"你的坐标靠近分界线，除了“独立回撤型”，也带有“焦虑确认型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","FEARFUL":"你的坐标靠近分界线，除了“独立回撤型”，也带有“靠近警报型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。"},"FEARFUL":{"SECURE":"你的坐标靠近分界线，除了“靠近警报型”，也带有“安全联结型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","ANXIOUS":"你的坐标靠近分界线，除了“靠近警报型”，也带有“焦虑确认型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。","AVOIDANT":"你的坐标靠近分界线，除了“靠近警报型”，也带有“独立回撤型”的反应。关系对象和近期压力变化时，次要倾向可能更明显。"}},"shareTemplate":["我的关系联结方式是：{typeName}","{coreConclusion}","关系不是固定人格，重要的是看见自己靠近爱与保护自己的方式。"]};</script>
    <script>
(function () {
  const app = document.getElementById("app");
  const configPaths = ["./configs/site-config.json", "./configs/career-change.json"];

  const state = {
    config: null,
    answers: {},
    profile: { birthDate: "", actualAge: "" },
    currentIndex: 0,
    selected: null,
    locked: false,
    loadingStep: 0,
    route: "home",
    resultData: null,
  };

  const defaultLoadingMessages = [
    "正在读取你的选择倾向...",
    "正在识别隐藏动机...",
    "正在计算结果分布...",
    "正在生成专属报告...",
    "分析完成。",
  ];

  init();

  async function init() {
    try {
      state.config = await fetchConfig();
      applyDocumentMeta(state.config);
      applyTheme(state.config);

      const saved = sessionStorage.getItem(getStorageKey());
      if (saved) {
        state.answers = JSON.parse(saved);
      }
      const savedProfile = sessionStorage.getItem(getProfileStorageKey());
      if (savedProfile) {
        state.profile = JSON.parse(savedProfile);
      }

      routeFromHash();
      window.addEventListener("hashchange", routeFromHash);
    } catch (error) {
      app.innerHTML = `
        <div class="error">
          <div>
            <h1>测试加载失败</h1>
            <p>请确认你是通过网页链接打开页面，而不是直接双击 HTML 文件。</p>
          </div>
        </div>
      `;
      console.error(error);
    }
  }

  async function fetchConfig() {
    if (window.__QUIZ_CONFIG__) return window.__QUIZ_CONFIG__;
    let lastError;
    for (const path of configPaths) {
      try {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path} ${response.status}`);
        return response.json();
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError;
  }

  function applyDocumentMeta(cfg) {
    const title = cfg.title || "趣味测试";
    const description = cfg.metaDescription || cfg.subtitle || "完成测试，生成你的专属报告。";
    document.title = title;
    setMeta("name", "description", description);
    setMeta("property", "og:title", title);
    setMeta("property", "og:description", description);
  }

  function applyTheme(cfg) {
    Object.entries(cfg.theme || {}).forEach(([name, value]) => {
      document.documentElement.style.setProperty(name, value);
    });
  }

  function setMeta(attr, key, content) {
    let node = document.querySelector(`meta[${attr}="${key}"]`);
    if (!node) {
      node = document.createElement("meta");
      node.setAttribute(attr, key);
      document.head.appendChild(node);
    }
    node.setAttribute("content", content);
  }

  function routeFromHash() {
    const route = (location.hash || "#/").replace("#/", "") || "home";
    renderRoute(route);
  }

  function navigate(route) {
    const nextHash = `#/${route}`;
    if (location.hash === nextHash) {
      renderRoute(route);
      return;
    }
    location.hash = nextHash;
  }

  function renderRoute(route) {
    state.route = route;
    if (route === "quiz") renderQuiz();
    else if (route === "loading") startLoading();
    else if (route === "result") renderResult();
    else renderHome();
  }

  function renderShell(content, extraClass = "") {
    app.innerHTML = `
      <div class="shell">
        <div class="top-rule"></div>
        <section class="screen ${extraClass}">${content}</section>
      </div>
      <div id="toast" class="toast">已复制</div>
    `;
  }

  function renderHome() {
    const cfg = state.config;
    renderShell(
      `
      <div class="home">
        <div class="kicker"><span class="dot"></span><span>${text(cfg.kicker)}</span><span class="dot"></span></div>
        <h1 class="hero-title">${text(cfg.title)}</h1>
        <p class="hero-subtitle">${text(cfg.subtitle)}</p>
        <div class="hairline"></div>
        <div class="intro">
          ${(cfg.intro || []).map((p, index) => `<p class="${index === cfg.intro.length - 1 ? "strong" : ""}">${text(p)}</p>`).join("")}
        </div>
        ${!cfg.compactHome && (cfg.dimensions || []).length ? `
          <div class="pill-grid">
            ${(cfg.dimensions || []).map((item) => `<div class="pill">${text(item)}</div>`).join("")}
          </div>
        ` : ""}
        ${cfg.testInfo ? `
          <section class="home-card info-card">
            <h2>${text(cfg.testInfo.title || "测验说明")}</h2>
            <ul>${(cfg.testInfo.bullets || []).map((item) => `<li>${text(item)}</li>`).join("")}</ul>
          </section>

        ${cfg.profileInput ? `

                ${cfg.profileInput.type === "number" ? `inputmode="numeric" min="${text(cfg.profileInput.min || 1)}" max="${text(cfg.profileInput.max || 99)}" placeholder="${text(cfg.profileInput.placeholder || "")}"` : ""}
                ${cfg.profileInput.required ? "required" : ""}
              >
            </div>
            <p class="profile-note">${text(cfg.profileInput.note || "")}</p>
            <p class="profile-error" data-profile-error aria-live="polite"></p>
          </section>
        ` : ""}
        <button class="primary-btn" data-action="start">${text(cfg.startButton || "开始测试")}</button>
        ${cfg.compactHome && (cfg.dimensions || []).length ? `
          <div class="pill-grid compact-pills">
            ${(cfg.dimensions || []).map((item) => `<div class="pill">${text(item)}</div>`).join("")}

        ` : ""}
        <p class="disclaimer">${text(cfg.disclaimer || "本测试为趣味内容，仅供娱乐参考。")}</p>
      </div>
      `,
      "home"
    );
    const startButton = app.querySelector("[data-action='start']");
    const profileField = app.querySelector("#profile-value");
    const profileError = app.querySelector("[data-profile-error]");
    profileField?.addEventListener("input", () => {
      profileField.classList.remove("invalid");
      if (profileError) profileError.textContent = "";
    });
    let started = false;
    const startQuiz = () => {
      if (started) return;
      const profileValue = profileField?.value?.trim() || "";
      if (cfg.profileInput?.required && !profileValue) {
        profileField?.classList.add("invalid");
        if (profileError) profileError.textContent = cfg.profileInput?.error || "请先填写信息，再开始测试。";
        profileField?.focus();
        return;
      }
      if (cfg.profileInput?.type === "number") {
        const numericValue = Number(profileValue);
        const min = Number(cfg.profileInput.min || 1);
        const max = Number(cfg.profileInput.max || 99);
        if (!Number.isFinite(numericValue) || numericValue < min || numericValue > max) {
          profileField?.classList.add("invalid");
          if (profileError) profileError.textContent = cfg.profileInput?.rangeError || `请输入 ${min}-${max} 之间的数字。`;
          profileField?.focus();
          return;
        }
      }
      started = true;
      state.answers = {};
      state.profile = buildProfileFromInput(cfg.profileInput, profileValue);
      state.currentIndex = 0;
      sessionStorage.removeItem(getStorageKey());
      sessionStorage.setItem(getProfileStorageKey(), JSON.stringify(state.profile));
      navigate("quiz");
    };
    startButton.addEventListener("click", startQuiz);
    startButton.addEventListener(
      "touchend",
      (event) => {
        event.preventDefault();
        startQuiz();
      },
      { passive: false }
    );
  }

  function renderQuiz() {
    const questions = state.config.questions || [];
    const question = questions[state.currentIndex];
    if (!question) {
      renderHome();
      return;
    }

    const progress = ((state.currentIndex + 1) / questions.length) * 100;

    renderShell(
      `
      <div class="sticky-head">
        <div class="quiz-meta">
          <span>${String(state.currentIndex + 1).padStart(2, "0")} / ${questions.length}</span>
          <span>${text(question.module)}</span>
        </div>
        <div class="progress-track"><div class="progress-bar" style="width:${progress}%"></div></div>
      </div>
      <div class="question-no">${String(state.currentIndex + 1).padStart(2, "0")}</div>
      <h1 class="question-title">${text(question.text)}</h1>

        ${(question.options || [])
          .map(
            (option) => `

              <span class="option-text">${text(option.text)}</span>

  function selectOption(key) {
    if (state.locked) return;
    state.locked = true;
    state.selected = key;
    const question = state.config.questions[state.currentIndex];
    state.answers[question.id] = key;

    app.querySelectorAll(".option").forEach((button) => {
      const selected = button.dataset.option === key;
      button.classList.toggle("selected", selected);
      button.classList.toggle("dimmed", !selected);
    });

    window.setTimeout(() => {
      if (state.currentIndex < state.config.questions.length - 1) {
        state.currentIndex += 1;
        state.locked = false;
        state.selected = null;
        renderQuiz();
      } else {
        sessionStorage.setItem(getStorageKey(), JSON.stringify(state.answers));
        state.locked = false;
        navigate("loading");
      }
    }, 420);

    const loadingMessages = getLoadingMessages();
    renderShell(
      `

          ${loadingMessages.map((_, index) => `<div class="step ${index < state.loadingStep ? "done" : ""}"><span></span></div>`).join("")}
        </div>
      </div>
      `,
      "loading-screen"
    );
  }

  function tickLoading() {
    if (state.route !== "loading") return;
    const loadingMessages = getLoadingMessages();
    if (state.loadingStep >= loadingMessages.length) {
      window.setTimeout(() => navigate("result"), 700);
      return;
    }
    const message = loadingMessages[state.loadingStep];
    let chars = 0;
    const interval = window.setInterval(() => {
      chars += 1;
      renderLoading(message.slice(0, chars));
      if (chars >= message.length) {
        window.clearInterval(interval);
        window.setTimeout(() => {
          state.loadingStep += 1;
          tickLoading();
        }, 520);
      }
    }, 35);
  }

  function renderCompareListSection(leftTitle, rightTitle, leftItems, rightItems) {

  function scoreAnswers(answers) {
    if (state.config.scoring?.mode === "attachment-two-axis") {
      return scoreAttachmentTwoAxis(answers, state.config.scoring);
    }
    if (state.config.scoring?.mode === "psychological-age") {
      return scorePsychologicalAge(answers, state.config.scoring);
    }
    if (state.config.scoring?.mode === "paired-attributes") {
      return scorePairedAttributes(answers, state.config.scoring);
    }
    if (state.config.scoring?.mode === "city-with-elements") {
      return scoreCityWithElements(answers, state.config.scoring);
    }

    const resultKeys = Object.keys(state.config.results || {});
    const counts = Object.fromEntries(resultKeys.map((key) => [key, 0]));
    (state.config.questions || []).forEach((question) => {
      const answerKey = answers[question.id];
      if (!answerKey) return;
      const option = (question.options || []).find((item) => item.key === answerKey);
      const weights = option?.weights;
      if (weights && typeof weights === "object") {
        Object.entries(weights).forEach(([key, value]) => {
          if (counts[key] !== undefined) counts[key] += Number(value) || 0;
        });
        return;
      }
      const scoreKey = option?.score || option?.result || answerKey;
      if (counts[scoreKey] !== undefined) counts[scoreKey] += 1;
    });
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const threshold = state.config.secondaryThreshold ?? 2;
    const primary = sorted[0][0];
    const secondary = sorted[1][1] > 0 && sorted[0][1] - sorted[1][1] <= threshold ? sorted[1][0] : null;
    return { counts, primary, secondary };
  }

  function scoreAttachmentTwoAxis(answers, scoring) {
    const answerValues = scoring.answerValues || { A: 1, B: 2, C: 3, D: 4, E: 5 };
    const totals = { anxiety: 0, avoidance: 0 };
    const itemCounts = { anxiety: 0, avoidance: 0 };

    (state.config.questions || []).forEach((question) => {
      const answerKey = answers[question.id];
      const dimension = question.dimension;
      if (!answerKey || !(dimension in totals)) return;
      const base = Number(answerValues[answerKey] ?? answerValues[String(answerKey)] ?? 0);
      if (!Number.isFinite(base) || base < 1 || base > 5) return;
      const adjusted = question.reverse ? 6 - base : base;
      totals[dimension] += adjusted;
      itemCounts[dimension] += 1;
    });

    const toPercent = (dimension) => {
      const count = itemCounts[dimension] || 0;
      if (!count) return 0;
      const averageScore = totals[dimension] / count;
      return clamp(Math.round(((averageScore - 1) / 4) * 100), 0, 100);
    };

    const anxiety = toPercent("anxiety");
    const avoidance = toPercent("avoidance");
    const threshold = Number(scoring.threshold ?? 50);
    const anxietyHigh = anxiety >= threshold;
    const avoidanceHigh = avoidance >= threshold;
    const resultMap = scoring.resultMap || {
      "low-low": "SECURE",
      "high-low": "ANXIOUS",
      "low-high": "AVOIDANT",
      "high-high": "FEARFUL",
    };
    const quadrantKey = `${anxietyHigh ? "high" : "low"}-${avoidanceHigh ? "high" : "low"}`;
    const primary = resultMap[quadrantKey];
    const mixedBand = Array.isArray(scoring.mixedBand) ? scoring.mixedBand : [42, 58];
    const mixed =
      (anxiety >= Number(mixedBand[0]) && anxiety <= Number(mixedBand[1])) ||
      (avoidance >= Number(mixedBand[0]) && avoidance <= Number(mixedBand[1]));

    let secondary = null;
    if (mixed) {
      const flipAnxiety = Math.abs(anxiety - threshold) <= Math.abs(avoidance - threshold);
      const secondaryKey = flipAnxiety
        ? `${anxietyHigh ? "low" : "high"}-${avoidanceHigh ? "high" : "low"}`
        : `${anxietyHigh ? "high" : "low"}-${avoidanceHigh ? "low" : "high"}`;
      secondary = resultMap[secondaryKey] || null;
    }

    const counts = Object.fromEntries(
      Object.keys(state.config.results || {}).map((key) => [
        key,
        key === primary ? (state.config.questions || []).length : 0,
      ])
    );

    return {
      counts,
      primary,
      secondary,
      attachment: {
        anxiety,
        avoidance,
        threshold,
        mixed,
      },
    };
  }

  function scorePsychologicalAge(answers, scoring) {
    const answerValues = scoring.answerValues || { A: 1, B: 2, C: 3, D: 4, E: 5 };
    const dimensionLabels = scoring.dimensionLabels || {};
    const dimensionOrder = scoring.dimensionOrder || Object.keys(dimensionLabels);
    const rawTotals = Object.fromEntries(dimensionOrder.map((key) => [key, 0]));
    const rawCounts = Object.fromEntries(dimensionOrder.map((key) => [key, 0]));

    (state.config.questions || []).forEach((question) => {
      const answerKey = answers[question.id];
      if (!answerKey || !question.dimension) return;
      const base = Number(answerValues[answerKey] ?? answerValues[String(answerKey)] ?? 0);
      if (!Number.isFinite(base) || base <= 0) return;
      const value = question.reverse ? 6 - base : base;
      rawTotals[question.dimension] = (rawTotals[question.dimension] || 0) + value;
      rawCounts[question.dimension] = (rawCounts[question.dimension] || 0) + 1;
    });

    const dimensions = {};
    dimensionOrder.forEach((key) => {
      const count = rawCounts[key] || 0;
      if (!count) {
        dimensions[key] = 0;
        return;
      }
      const min = count;
      const max = count * 5;
      dimensions[key] = Math.round(((rawTotals[key] - min) / (max - min)) * 100);
    });

    const matureDimensions = scoring.matureDimensions || ["emotion", "responsibility", "resilience", "tolerance", "selfAcceptance"];
    const youthfulDimensions = scoring.youthfulDimensions || ["curiosity", "socialEase", "lifePassion"];
    const matureIndex = average(matureDimensions.map((key) => dimensions[key]));
    const youthfulIndex = average(youthfulDimensions.map((key) => dimensions[key]));
    const actualAge = getActualAge(scoring);
    const psychologicalAge = clamp(
      Math.round(actualAge + (matureIndex - youthfulIndex) * Number(scoring.ageFactor ?? 0.22)),
      Number(scoring.minAge ?? 10),
      Number(scoring.maxAge ?? 70)
    );
    const delta = psychologicalAge - actualAge;
    const primary = getPsychologicalResultKey(delta, scoring);
    const counts = Object.fromEntries(Object.keys(state.config.results || {}).map((key) => [key, key === primary ? (state.config.questions || []).length : 0]));
    const rankedDimensions = dimensionOrder
      .map((key) => ({ key, label: dimensionLabels[key] || key, value: dimensions[key] ?? 0 }))
      .sort((left, right) => right.value - left.value);
    const tags = buildPsychologicalTags(rankedDimensions, delta, primary, scoring);

    return {
      counts,
      primary,
      secondary: null,
      psychological: {
        actualAge,
        psychologicalAge,
        delta,
        ageLabel: getPsychologicalAgeLabel(delta),
        matureIndex: Math.round(matureIndex),
        youthfulIndex: Math.round(youthfulIndex),
        dimensions,
        dimensionLabels,
        dimensionOrder,
        topDimensions: rankedDimensions.slice(0, 3),
        lowDimensions: rankedDimensions.slice(-2).reverse(),
        tags,
      },
    };
  }

  function getActualAge(scoring) {
    const numericAge = Number(state.profile.actualAge);
    if (Number.isFinite(numericAge) && numericAge > 0) return Math.round(numericAge);
    const birthAge = calculateAgeFromBirthDate(state.profile.birthDate);
    if (birthAge) return birthAge;
    return Number(scoring.defaultActualAge || 28);
  }

  function calculateAgeFromBirthDate(value) {
    if (!value) return null;
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return null;
    const now = new Date();
    let age = now.getFullYear() - date.getFullYear();
    const monthDiff = now.getMonth() - date.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < date.getDate())) age -= 1;
    return age > 0 ? age : null;
  }

  function getPsychologicalResultKey(delta, scoring) {
    const groups = scoring.ageGroups || [
      { key: "CURIOUS_CHILD", maxDelta: -8 },
      { key: "HOT_BLOODED_TEEN", maxDelta: -3 },
      { key: "BALANCED_YOUTH", maxDelta: 2 },
      { key: "STEADY_ADVISER", maxDelta: 7 },
      { key: "CLEAR_HELM", maxDelta: Infinity },
    ];
    const hit = groups.find((item) => delta <= Number(item.maxDelta));
    return hit?.key || groups[groups.length - 1]?.key || Object.keys(state.config.results || {})[0];
  }

  function getPsychologicalAgeLabel(delta) {
    if (delta <= -8) return "灵魂明显年轻";
    if (delta <= -3) return "少年感在线";
    if (delta <= 2) return "与真实年龄同频";
    if (delta <= 7) return "心智略超前";
    return "灵魂明显成熟";
  }

  function buildPsychologicalTags(rankedDimensions, delta, primary, scoring) {
    const tagMap = scoring.dimensionTags || {};
    const ageTags = scoring.ageTags || {};
    const resultTags = scoring.resultTags || {};
    const tags = rankedDimensions
      .slice(0, 3)
      .map((item) => tagMap[item.key]?.[0] || item.label)
      .filter(Boolean);
    tags.push(ageTags[getPsychologicalAgeLabel(delta)] || getPsychologicalAgeLabel(delta));
    tags.push(resultTags[primary] || "社交原型清晰");
    return [...new Set(tags)].slice(0, 5);
  }

  function scoreCityWithElements(answers, scoring) {
    const resultKeys = Object.keys(state.config.results || {});
    const counts = Object.fromEntries(resultKeys.map((key) => [key, 0]));
    const elementMap = scoring.elementMap || {};
    const elementCounts = {};
    Object.values(elementMap).forEach((element) => { elementCounts[element] = 0; });

    (state.config.questions || []).forEach((question) => {
      const answerKey = answers[question.id];
      if (!answerKey) return;
      const option = (question.options || []).find((item) => item.key === answerKey);
      const scoreKey = option?.score || option?.result || answerKey;
      const element = elementMap[scoreKey];
      if (counts[scoreKey] !== undefined) counts[scoreKey] += 1;
      if (element && elementCounts[element] !== undefined) elementCounts[element] += 1;
    });

    const personalityElement = Object.entries(elementCounts).sort((left, right) => right[1] - left[1])[0]?.[0] || "未提供";
    const birthElement = getBirthElement(state.profile.birthDate, scoring);
    const birthWeight = Number(scoring.birthWeight ?? 0.25);
    const combined = Object.fromEntries(resultKeys.map((key) => {
      const birthBonus = elementMap[key] === birthElement ? (state.config.questions.length * birthWeight) : 0;
      return [key, counts[key] + birthBonus];
    }));
    const sorted = Object.entries(combined).sort((left, right) => right[1] - left[1]);
    const threshold = state.config.secondaryThreshold ?? 2;
    const primary = sorted[0][0];
    const secondary = sorted[1][1] > 0 && sorted[0][1] - sorted[1][1] <= threshold ? sorted[1][0] : null;
    const personalityShare = counts[primary] / Math.max(1, state.config.questions.length);
    const birthMatch = elementMap[primary] === birthElement;
    const matchScore = Math.round(Math.min(99, 55 + personalityShare * 30 + (birthMatch ? 15 : 5)));
    return {
      counts,
      primary,
      secondary,
      match: { birthElement, personalityElement, elementCounts, matchScore },
    };
  }

  function getBirthElement(value, scoring) {
    if (!value) return "未提供";
    const parts = value.split("-").map(Number);
    if (parts.length !== 3 || parts.some((part) => !Number.isFinite(part))) return "未提供";
    const [year, month, day] = parts;
    const elements = scoring.birthElements || ["木", "火", "土", "金", "水"];
    return elements[Math.abs(year * 13 + month * 7 + day) % elements.length];
  }

  function scorePairedAttributes(answers, scoring) {
    const attributes = Object.fromEntries((scoring.attributes || []).map((key) => [key, 0]));
    const questionsById = Object.fromEntries((state.config.questions || []).map((question) => [question.id, question]));

    (state.config.questions || []).forEach((question) => {
      const answerKey = answers[question.id];
      if (!answerKey) return;
      const option = (question.options || []).find((item) => item.key === answerKey);
      (option?.attributes || []).forEach((attribute) => {
        if (attributes[attribute] !== undefined) attributes[attribute] += 1;
      });
    });

    const chosen = (scoring.pairs || []).map(([left, right], index) => {
      if (attributes[left] > attributes[right]) return left;
      if (attributes[right] > attributes[left]) return right;

      const tieQuestionId = scoring.tieBreakers?.[String(index)];
      const tieQuestion = questionsById[tieQuestionId];
      const tieAnswer = tieQuestion && answers[tieQuestionId];
      const tieOption = tieQuestion?.options?.find((item) => item.key === tieAnswer);
      return tieOption?.attributes?.includes(left) ? left : right;
    });

    const primary = chosen.join("");
    const counts = Object.fromEntries(Object.keys(state.config.results || {}).map((key) => [key, key === primary ? (state.config.questions || []).length : 0]));
    const alternate = chosen.slice();
    if (scoring.pairs?.length) {
      const firstPair = scoring.pairs[0];
      alternate[0] = alternate[0] === firstPair[0] ? firstPair[1] : firstPair[0];
    }
    const secondary = alternate.join("") !== primary && state.config.secondaryNotes?.[primary]?.[alternate.join("")] ? alternate.join("") : null;
    return { counts, primary, secondary, attributes };
  }

  function getStage(score) {
    const labels = state.config.stageLabels || [
      { max: 45, label: "观察期" },
      { max: 65, label: "验证期" },
      { max: 82, label: "规划期" },
      { max: 100, label: "行动期" },
    ];
    const hit = labels.find((item) => score <= item.max);
    return hit ? hit.label : labels[labels.length - 1].label;
  }

  function buildShareText(primary, secondary) {
    const template = state.config.shareTemplate || [
      "我测出了：{{typeName}}",
      "{{posterSubtext}}",
      "{{secondaryLine}}",
      "",
      "{{title}}",
    ];
    const values = {
      title: state.config.title,
      typeName: primary.typeName,
      posterSubtext: primary.posterSubtext,
      secondary: secondary || "",
      secondaryLine: secondary ? `副倾向：${secondary}` : "",
    };
    return template
      .map((line) => fillTemplate(line, values))
      .filter((line, index, arr) => line || arr[index - 1])
      .join("\n")
      .trim();
  }

  async function copyShareText(value) {
    try {
      await navigator.clipboard.writeText(value);
      showToast("结果文案已复制");
    } catch (error) {
      showToast("复制失败，可长按手动复制");
    }
  }

  function showToast(value) {
    const toast = document.getElementById("toast");
    if (!toast) return;
    toast.textContent = value;
    toast.classList.add("show");
    window.setTimeout(() => toast.classList.remove("show"), 1600);
  }

  function getLoadingMessages() {
    return state.config.loadingMessages || defaultLoadingMessages;
  }

  function getStorageKey() {
    return `xhsTestAnswers:${state.config.slug || "default"}`;
  }

  function getProfileStorageKey() {
    return `xhsTestProfile:${state.config?.slug || "default"}`;
  }

  function getProfileInputValue(inputConfig) {
    if (!inputConfig) return "";
    if (inputConfig.type === "number") return state.profile.actualAge || "";
    return state.profile.birthDate || "";
  }

  function buildProfileFromInput(inputConfig, value) {
    if (inputConfig?.type === "number") {
      return { birthDate: "", actualAge: value };
    }
    return { birthDate: value, actualAge: "" };
  }

  function fillTemplate(template, values) {
    return String(template).replace(/\{\{(\w+)\}\}/g, (_, key) => values[key] || "");
  }

  function number(value) {
    const parsed = Number(value);
    if (Number.isNaN(parsed)) return 0;
    return Math.max(0, Math.min(100, parsed));
  }

  function average(values) {
    const cleanValues = values.map(Number).filter((value) => Number.isFinite(value));
    if (!cleanValues.length) return 0;
    return cleanValues.reduce((sum, value) => sum + value, 0) / cleanValues.length;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function text(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
